<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scopa">
<meta name="theme-color" content="#1a0f00">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scopa Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/reset.css">
<link rel="stylesheet" href="../shared/components.css">
<style>
  :root {
    --bg: #1a0f00;
    --card: #2a1a08;
    --card2: #3a2510;
    --primary: #c9993a;
    --primary-light: #e8c46a;
    --primary-shadow: rgba(201,153,58,0.3);
    --text: #f2e8d0;
    --text-dim: #9a8068;
    --danger: #8b2020;
    --danger-light: #d05050;
    --danger-border: rgba(208,80,80,0.35);
    --border: rgba(201,153,58,0.22);
    --shadow: 0 6px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(232,196,106,0.06);
    --font-display: 'Playfair Display', serif;
    --font-body: 'Crimson Pro', Georgia, serif;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,153,58,0.16) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9993a' fill-opacity='0.035'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

  .card { border-radius: 16px; background: linear-gradient(180deg, var(--card) 0%, color-mix(in srgb, var(--card) 80%, var(--bg)) 100%); }
  .card-title { opacity: 0.85; }

  /* ── HEADER ── */
  .app-header { text-align: center; padding: 8px 20px 22px; }
  .app-header h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 700;
    font-size: 3.4rem;
    line-height: 1;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, var(--primary-light), var(--primary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .app-header .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .ornament { color: var(--primary); font-size: 0.8rem; opacity: 0.6; margin-top: 10px; letter-spacing: 0.6em; }

  /* ── MODE TILES ── */
  .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.12s ease-out;
  }
  .mode-btn:active { transform: scale(0.96); }
  .mode-btn .icon { font-size: 1.7rem; display: block; margin-bottom: 4px; }
  .mode-btn .label { font-family: var(--font-display); font-size: 1.05rem; display: block; }
  .mode-btn .sub { font-size: 0.8rem; color: var(--text-dim); display: block; margin-top: 2px; }
  .mode-btn.selected {
    border-color: var(--primary);
    background: rgba(201,153,58,0.14);
    box-shadow: 0 0 0 1px var(--primary), 0 6px 20px rgba(201,153,58,0.15);
  }

  /* ── SEGMENTED CONTROL ── */
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .seg button {
    flex: 1 1 0;
    min-width: 0;
    min-height: 40px;
    padding: 0 6px;
    border-radius: 9px;
    font-family: var(--font-display);
    font-size: 0.95rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.22s, color 0.22s, box-shadow 0.22s, transform 0.12s ease-out;
  }
  .seg button:active { transform: scale(0.94); }
  .seg button.on {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: var(--bg);
    font-weight: 700;
    box-shadow: 0 2px 10px var(--primary-shadow);
  }
  .seg button.tie { flex: 0 0 auto; padding: 0 12px; font-style: italic; }
  .seg button.tie.on { background: var(--text-dim); box-shadow: none; }

  .target-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .target-row .seg { flex: 1; max-width: 180px; }
  .target-row .stepper-val { min-width: 52px; font-size: 1.3rem; }

  /* ── GAME TOP BAR ── */
  .game-title { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 1.4rem; color: var(--primary); flex: 1; }
  .target-badge {
    font-size: 0.85rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  /* ── SCOREBOARD ── */
  .players-grid { display: grid; gap: 10px; padding: 4px 16px 16px; }
  .players-grid.n2, .players-grid.n4 { grid-template-columns: 1fr 1fr; }
  .players-grid.n3 { grid-template-columns: 1fr 1fr 1fr; }

  .player-score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 12px 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s, background 0.4s, box-shadow 0.4s;
  }
  .player-score-card.leader {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(201,153,58,0.16), rgba(201,153,58,0.04));
    box-shadow: 0 8px 24px rgba(201,153,58,0.12);
  }
  .player-score-card .crown {
    position: absolute; top: 6px; right: 9px;
    font-size: 0.85rem; color: var(--primary);
    opacity: 0; transform: translateY(-6px) scale(0.6);
    transition: opacity 0.3s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .player-score-card.leader .crown { opacity: 1; transform: none; }
  .p-name {
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .p-score {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 2.7rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--primary-light);
    font-variant-numeric: tabular-nums;
  }
  .p-pending {
    position: absolute; left: 10px; top: 8px;
    font-size: 0.8rem; font-weight: 600;
    color: var(--bg); background: var(--primary-light);
    border-radius: 999px; padding: 0 7px;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.2s, transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .p-pending.show { opacity: 1; transform: none; }
  .p-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 8px; }
  .p-bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 2px;
    transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ── ROUND ENTRY ── */
  .round-title {
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--primary);
    text-align: center;
    margin-bottom: 6px;
  }
  .cat { padding: 12px 0; border-top: 1px solid rgba(201,153,58,0.1); }
  .cat:first-of-type { border-top: none; }
  .cat-label { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; margin-bottom: 8px; }
  .cat-label .cat-icon { width: 1.4rem; text-align: center; }
  .cat-label small { margin-left: auto; color: var(--text-dim); font-size: 0.8rem; }
  .scopa-grid { display: grid; gap: 8px; }
  .scopa-cell { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .scopa-cell span { font-size: 0.95rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── DOCK (sticky bottom action) ── */
  .dock {
    position: sticky;
    bottom: 0;
    z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid var(--border);
  }
  .dock .btn { margin: 0; width: 100%; }

  /* ── HISTORY ── */
  .history-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(201,153,58,0.08);
  }
  .history-row:last-child { border-bottom: none; }
  .history-row.fresh { animation: gs-rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .hr-round {
    flex-shrink: 0;
    font-family: var(--font-display);
    font-size: 0.8rem;
    color: var(--primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px 7px;
  }
  .hr-pts { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.95rem; min-width: 0; }
  .hr-pts span { white-space: nowrap; }
  .hr-pts b { color: var(--primary-light); font-weight: 600; }
  .hr-pts em { color: var(--text-dim); font-style: normal; font-size: 0.85rem; }
  .hr-undo {
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: transform 0.12s ease-out;
  }
  .hr-undo:active { transform: scale(0.92); color: var(--danger-light); }

  /* ── WIN SCREEN ── */
  #win-screen { justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 40px 0 calc(24px + env(safe-area-inset-bottom)); }
  .win-trophy {
    font-size: 5rem;
    filter: drop-shadow(0 8px 24px rgba(232,196,106,0.45));
    animation: trophy-in 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) backwards, float 3s 0.8s ease-in-out infinite;
  }
  @keyframes trophy-in { from { opacity: 0; transform: scale(0.3) rotate(-20deg); } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .win-name {
    font-family: var(--font-display);
    font-size: 2.6rem;
    font-style: italic;
    font-weight: 700;
    line-height: 1.1;
    color: var(--primary-light);
    padding: 0 20px;
    animation: gs-rise 0.6s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }
  .win-subtitle { color: var(--text-dim); font-size: 1.1rem; animation: gs-fade 0.6s 0.4s backwards; }
  .win-scores { width: calc(100% - 32px); max-width: 340px; padding: 8px 20px; margin: 10px 0; }
  .win-score-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 1.1rem; border-bottom: 1px solid rgba(201,153,58,0.08); }
  .win-score-row:last-child { border-bottom: none; }
  .win-score-row.winner { color: var(--primary-light); font-family: var(--font-display); }
  #win-screen .btn { max-width: 340px; }
</style>
</head>
<body>
<div id="app">

  <!-- ═══ SETUP SCREEN ═══ -->
  <div id="setup-screen" class="screen active">
    <div class="top-bar"><a href="../index.html" class="hub-link">‹ Hub</a></div>
    <div class="app-header">
      <h1>Scopa</h1>
      <div class="subtitle">Score Keeper</div>
      <div class="ornament">✦ ✦ ✦</div>
    </div>

    <div class="stagger">
      <div class="card">
        <div class="card-title">Mode</div>
        <div class="mode-row">
          <button class="mode-btn selected" data-mode="players" onclick="selectMode('players')">
            <span class="icon">👤</span>
            <span class="label">Players</span>
            <span class="sub">Individual</span>
          </button>
          <button class="mode-btn" data-mode="teams" onclick="selectMode('teams')">
            <span class="icon">👥</span>
            <span class="label">Teams</span>
            <span class="sub">2 teams</span>
          </button>
        </div>
      </div>

      <!-- players setup -->
      <div id="players-setup" class="card">
        <div class="card-title">Players</div>
        <div class="seg" id="count-seg" style="margin-bottom:14px;">
          <button class="on" data-n="2" onclick="setPlayerCount(2)">2</button>
          <button data-n="3" onclick="setPlayerCount(3)">3</button>
          <button data-n="4" onclick="setPlayerCount(4)">4</button>
        </div>
        <div id="player-names"></div>
      </div>

      <!-- teams setup -->
      <div id="teams-setup" class="card" style="display:none;">
        <div class="card-title">Teams</div>
        <div class="player-input-row">
          <div class="player-num">A</div>
          <input type="text" id="team1-name" placeholder="Team A" maxlength="16" autocomplete="off">
        </div>
        <div class="player-input-row">
          <div class="player-num" style="background:var(--danger-light);">B</div>
          <input type="text" id="team2-name" placeholder="Team B" maxlength="16" autocomplete="off">
        </div>
      </div>

      <div class="card">
        <div class="card-title">Play to</div>
        <div class="target-row">
          <div class="seg" id="target-seg">
            <button data-t="11" onclick="setTarget(11)">11</button>
            <button data-t="16" onclick="setTarget(16)">16</button>
            <button data-t="21" onclick="setTarget(21)">21</button>
          </div>
          <div class="stepper">
            <button class="stepper-btn" onclick="setTarget(target - 1)" aria-label="Lower target">−</button>
            <span class="stepper-val" id="target-val">11</span>
            <button class="stepper-btn" onclick="setTarget(target + 1)" aria-label="Raise target">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="dock"><button class="btn btn-primary" onclick="startGame()">Start Game</button></div>
  </div>

  <!-- ═══ GAME SCREEN ═══ -->
  <div id="game-screen" class="screen">
    <div class="top-bar">
      <a href="../index.html" class="hub-link">‹ Hub</a>
      <div class="game-title">Scopa</div>
      <div class="target-badge" id="target-badge">First to 11</div>
    </div>

    <div class="players-grid" id="players-grid"></div>

    <div class="card">
      <div class="round-title" id="round-title">Round 1</div>
      <div id="scoring-body"></div>
    </div>

    <div class="card" id="history-card" style="display:none;">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>History</span>
        <span id="rounds-played" style="font-size:0.75rem;opacity:0.6;letter-spacing:0.1em;"></span>
      </div>
      <div id="history-list"></div>
    </div>

    <button class="btn btn-danger" onclick="confirmNewGame()">New Game</button>
    <div class="spacer"></div>
    <div class="dock"><button class="btn btn-primary" onclick="confirmRound()">Confirm Round</button></div>
  </div>

  <!-- ═══ WIN SCREEN ═══ -->
  <div id="win-screen" class="screen">
    <div class="win-trophy">🏆</div>
    <div class="win-name" id="win-name"></div>
    <div class="win-subtitle">wins the game!</div>
    <div class="card win-scores stagger" id="win-scores"></div>
    <button class="btn btn-primary" onclick="startNew()">Play Again</button>
    <button class="btn btn-secondary" onclick="goSetup()">Change Settings</button>
  </div>

</div>

<script src="../shared/base.js"></script>
<script>
// ── STATE ──
let state = {
  mode: 'players',
  players: [],
  target: 11,
  round: 1,
  history: [],
  scores: [],
  roundData: {}
};
const SAVE_KEY = 'scopa-game';
const esc = GS.esc;

function persist(screen) {
  GS.save(SAVE_KEY, { state, screen });
}

// ── SETUP HELPERS ──
function selectMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.toggle('selected', b.dataset.mode === m));
  document.getElementById('players-setup').style.display = m === 'players' ? '' : 'none';
  document.getElementById('teams-setup').style.display = m === 'teams' ? '' : 'none';
}

let playerCount = 2;
function setPlayerCount(n) {
  playerCount = n;
  document.querySelectorAll('#count-seg button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  renderPlayerNames();
}

function renderPlayerNames() {
  const c = document.getElementById('player-names');
  const prev = [...c.querySelectorAll('input')].map(i => i.value);
  c.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    c.innerHTML += `
      <div class="player-input-row">
        <div class="player-num">${i+1}</div>
        <input type="text" id="pname-${i}" placeholder="Player ${i+1}" maxlength="16" autocomplete="off" value="${esc(prev[i] || '')}">
      </div>`;
  }
}
renderPlayerNames();

let target = 11;
function setTarget(t) {
  target = Math.max(1, Math.min(99, t));
  const el = document.getElementById('target-val');
  if (el.textContent !== String(target)) { el.textContent = target; GS.bump(el); }
  document.querySelectorAll('#target-seg button').forEach(b => b.classList.toggle('on', +b.dataset.t === target));
}
setTarget(11);

function startGame() {
  state.target = target;

  if (state.mode === 'teams') {
    const t1 = document.getElementById('team1-name').value.trim() || 'Team A';
    const t2 = document.getElementById('team2-name').value.trim() || 'Team B';
    state.players = [t1, t2];
  } else {
    state.players = [];
    for (let i = 0; i < playerCount; i++) {
      const v = document.getElementById(`pname-${i}`).value.trim() || `Player ${i+1}`;
      state.players.push(v);
    }
  }

  state.scores = state.players.map(() => 0);
  state.round = 1;
  state.history = [];

  buildGameUI();
  showScreen('game-screen');
  persist('game-screen');
}

// ── GAME UI ──
const CATS = [
  { key: 'scopa',   label: 'Scopa',      icon: '🌊', type: 'count' },
  { key: 'cards',   label: 'Most Cards', icon: '🃏', type: 'winner' },
  { key: 'coins',   label: 'Most Coins', icon: '🪙', type: 'winner' },
  { key: 'sette',   label: 'Bito Bello', icon: '⭐', type: 'winner' },
  { key: 'primiera',label: 'Primiera',   icon: '♠',  type: 'winner' },
];

function buildGameUI() {
  const n = state.players.length;
  const grid = document.getElementById('players-grid');
  grid.className = `players-grid n${n} stagger`;
  grid.innerHTML = state.players.map((p, i) => `
    <div class="player-score-card" id="psc-${i}">
      <span class="crown">♛</span>
      <span class="p-pending" id="pend-${i}"></span>
      <div class="p-name">${esc(p)}</div>
      <div class="p-score" id="score-${i}">${state.scores[i]}</div>
      <div class="p-bar"><i id="bar-${i}"></i></div>
    </div>`).join('');

  document.getElementById('target-badge').textContent = `First to ${state.target}`;

  renderScoreCards();
  buildScoringTable();
  renderHistory();
}

// Updates the cards in place so scores count and bars glide.
function renderScoreCards() {
  const maxScore = Math.max(...state.scores);
  state.players.forEach((_, i) => {
    const s = state.scores[i];
    const el = document.getElementById(`score-${i}`);
    GS.tween(el, +el.textContent, s);
    document.getElementById(`bar-${i}`).style.width = Math.min(100, s / state.target * 100) + '%';
    document.getElementById(`psc-${i}`).classList.toggle('leader', s === maxScore && maxScore > 0);
  });
}

function buildScoringTable() {
  state.roundData = {};
  let body = '';

  CATS.forEach(cat => {
    if (cat.type === 'count') {
      state.roundData[cat.key] = state.players.map(() => 0);
      const cells = state.players.map((p, i) => `
        <div class="scopa-cell">
          <span>${esc(p)}</span>
          <div class="stepper">
            <button class="stepper-btn" onclick="adjScopa(${i},-1)" aria-label="Remove scopa">−</button>
            <span class="stepper-val" id="scopa-${i}">0</span>
            <button class="stepper-btn" onclick="adjScopa(${i},1)" aria-label="Add scopa">+</button>
          </div>
        </div>`).join('');
      body += `<div class="cat">
        <div class="cat-label"><span class="cat-icon">${cat.icon}</span>${cat.label}<small>1 pt each</small></div>
        <div class="scopa-grid">${cells}</div>
      </div>`;
    } else {
      state.roundData[cat.key] = null;
      let btns = state.players.map((p, i) =>
        `<button id="dot-${cat.key}-${i}" onclick="selectWinner('${cat.key}',${i})">${esc(p)}</button>`).join('');
      btns += `<button class="tie" id="dot-${cat.key}-tie" onclick="selectWinner('${cat.key}','tie')">Tie</button>`;
      body += `<div class="cat">
        <div class="cat-label"><span class="cat-icon">${cat.icon}</span>${cat.label}</div>
        <div class="seg">${btns}</div>
      </div>`;
    }
  });

  document.getElementById('scoring-body').innerHTML = body;
  document.getElementById('round-title').textContent = `Round ${state.round}`;
  renderPending();
}

function adjScopa(i, delta) {
  const next = Math.max(0, state.roundData['scopa'][i] + delta);
  if (next === state.roundData['scopa'][i]) return;
  state.roundData['scopa'][i] = next;
  const el = document.getElementById(`scopa-${i}`);
  el.textContent = next;
  GS.bump(el);
  renderPending();
}

function selectWinner(cat, idx) {
  // Tapping the selected option again clears it.
  state.roundData[cat] = state.roundData[cat] === idx ? null : idx;
  const sel = state.roundData[cat];
  state.players.forEach((_, i) => document.getElementById(`dot-${cat}-${i}`).classList.toggle('on', i === sel));
  document.getElementById(`dot-${cat}-tie`).classList.toggle('on', sel === 'tie');
  renderPending();
}

function roundPoints() {
  const rd = state.roundData;
  const pts = state.players.map(() => 0);
  rd.scopa.forEach((s, i) => { pts[i] += s; });
  // winner categories: 1 pt each, nothing on a tie
  ['cards','coins','sette','primiera'].forEach(cat => {
    if (rd[cat] !== null && rd[cat] !== 'tie' && rd[cat] !== undefined) pts[rd[cat]] += 1;
  });
  return pts;
}

// "+N" chip on each score card while the round is being entered.
function renderPending() {
  roundPoints().forEach((p, i) => {
    const el = document.getElementById(`pend-${i}`);
    if (!el) return;
    const was = el.textContent;
    el.textContent = p ? `+${p}` : '';
    el.classList.toggle('show', p > 0);
    if (p && was !== el.textContent) GS.bump(el);
  });
}

function confirmRound() {
  const rd = state.roundData;
  const roundPts = roundPoints();

  roundPts.forEach((p, i) => { state.scores[i] += p; });

  state.history.push({
    round: state.round,
    pts: [...roundPts],
    scores: [...state.scores],
    scopa: [...rd.scopa],
    winners: { cards: rd.cards, coins: rd.coins, sette: rd.sette, primiera: rd.primiera }
  });
  state.round++;

  // Win: highest score at or past the target
  const best = Math.max(...state.scores);
  if (best >= state.target) {
    showWin(state.scores.indexOf(best));
    return;
  }

  renderScoreCards();
  buildScoringTable();
  renderHistory(true);
  persist('game-screen');
}

function renderHistory(fresh) {
  const list = document.getElementById('history-list');
  const card = document.getElementById('history-card');
  if (state.history.length === 0) { card.style.display = 'none'; return; }
  card.style.display = '';
  document.getElementById('rounds-played').textContent = `${state.history.length} round${state.history.length > 1 ? 's' : ''}`;
  list.innerHTML = state.history.slice().reverse().map((entry, revI) => {
    const i = state.history.length - 1 - revI;
    const pts = entry.pts.map((p, pi) =>
      `<span>${esc(state.players[pi])} <b>${p > 0 ? '+' + p : p}</b> <em>${entry.scores[pi]}</em></span>`).join('');
    return `<div class="history-row${fresh && revI === 0 ? ' fresh' : ''}">
      <span class="hr-round">R${entry.round}</span>
      <span class="hr-pts">${pts}</span>
      <button class="hr-undo" onclick="undoRound(${i})">Undo</button>
    </div>`;
  }).join('');
}

function undoRound(idx) {
  const entry = state.history[idx];
  entry.pts.forEach((p, i) => { state.scores[i] -= p; });
  state.history.splice(idx, 1);
  state.round--;
  renderScoreCards();
  buildScoringTable();
  renderHistory();
  persist('game-screen');
}

function confirmNewGame() {
  if (confirm('Start a new game? Current scores will be lost.')) startNew();
}

function startNew() {
  state.scores = state.players.map(() => 0);
  state.round = 1;
  state.history = [];
  buildGameUI();
  showScreen('game-screen');
  persist('game-screen');
}

function goSetup() {
  showScreen('setup-screen');
  persist('setup-screen');
}

// ── WIN SCREEN ──
function showWin(winIdx) {
  document.getElementById('win-name').textContent = state.players[winIdx];
  const order = state.players.map((p, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  document.getElementById('win-scores').innerHTML = order.map(i =>
    `<div class="win-score-row ${i === winIdx ? 'winner' : ''}">
      <span>${i === winIdx ? '🏆 ' : ''}${esc(state.players[i])}</span>
      <span>${state.scores[i]} pts</span>
    </div>`).join('');
  showScreen('win-screen');
  persist('win-screen');
  GS.confetti(['#c9993a', '#e8c46a', '#f2e8d0', '#8b2020']);
}

// ── RESUME a saved game ──
(function restore() {
  const saved = GS.load(SAVE_KEY);
  if (!saved || !saved.state || !saved.state.players.length) return;
  state = saved.state;
  selectMode(state.mode);
  setTarget(state.target);
  if (state.mode === 'players') setPlayerCount(state.players.length);
  state.players.forEach((p, i) => {
    const el = document.getElementById(state.mode === 'teams' ? `team${i+1}-name` : `pname-${i}`);
    if (el) el.value = p;
  });
  if (saved.screen === 'game-screen') {
    buildGameUI();
    showScreen('game-screen');
  } else if (saved.screen === 'win-screen') {
    buildGameUI();
    const best = Math.max(...state.scores);
    showWin(state.scores.indexOf(best));
  }
})();
</script>
