<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haptics test</title>
<!-- Temporary diagnostic page: which haptic trick works on this phone? Delete once settled. -->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: calc(16px + env(safe-area-inset-top)) 16px 32px; font: 16px/1.45 -apple-system, system-ui, sans-serif; background: #111318; color: #f1f2f5; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p { color: #a7adb8; margin: 0 0 16px; }
  .info { font: 13px/1.5 ui-monospace, Menlo, monospace; background: #1c1f26; border-radius: 12px; padding: 10px 12px; margin-bottom: 18px; word-break: break-word; }
  button { display: block; width: 100%; margin-bottom: 10px; padding: 16px; border: 0; border-radius: 14px; background: #2b3040; color: #fff; font: 600 17px -apple-system, system-ui, sans-serif; text-align: left; touch-action: manipulation; }
  button small { display: block; font-weight: 400; font-size: 13px; color: #a7adb8; margin-top: 2px; }
  button:active { background: #3a4156; }
  .real { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #1c1f26; margin-bottom: 10px; }
  .real input { width: 52px; height: 32px; }
  #log { font: 13px ui-monospace, Menlo, monospace; color: #8ce99a; min-height: 20px; }
</style>
</head>
<body>
<h1>Haptics test</h1>
<p>Tap each button and note which ones you feel. Then tell me the letters, plus the device line below.</p>
<div class="info" id="info"></div>

<label class="real"><span><b>0 · Real switch</b><br><small style="color:#a7adb8">Flip it yourself. If this doesn't buzz, the browser/phone gives no switch haptics at all.</small></span><input type="checkbox" switch></label>

<button onclick="a()">A · Hidden switch in head, label.click()<small>What the app does now</small></button>
<button onclick="b()">B · Hidden switch, input.click()<small>Clicks the input instead of its label</small></button>
<button onclick="c()">C · Off-screen switch in body (not display:none)</button>
<button onclick="d()">D · One persistent invisible switch, reused</button>
<button onclick="e()">E · Burst of 3 (variant D, 110 ms apart)</button>
<div id="log"></div>

<script>
const log = m => { document.getElementById('log').textContent = m + ' · ' + new Date().toLocaleTimeString(); };
const sw = () => { const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); return i; };

function a() {
  const l = document.createElement('label'), i = sw();
  l.appendChild(i); l.style.display = 'none'; l.setAttribute('aria-hidden', 'true');
  document.head.appendChild(l); l.click(); l.remove();
  log('A fired');
}
function b() {
  const l = document.createElement('label'), i = sw();
  l.appendChild(i); l.style.display = 'none';
  document.head.appendChild(l); i.click(); l.remove();
  log('B fired');
}
function c() {
  const l = document.createElement('label'), i = sw();
  l.appendChild(i);
  l.style.cssText = 'position:fixed;left:-200px;top:0;opacity:0;pointer-events:none';
  document.body.appendChild(l); l.click(); l.remove();
  log('C fired');
}
const keep = document.createElement('label');
keep.appendChild(sw());
keep.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;overflow:hidden;pointer-events:none';
keep.setAttribute('aria-hidden', 'true');
document.body.appendChild(keep);
function d() { keep.click(); log('D fired'); }
function e() { [0, 110, 220].forEach(t => setTimeout(() => keep.click(), t)); log('E fired'); }

const probe = document.createElement('input');
document.getElementById('info').textContent =
  navigator.userAgent +
  ' | standalone=' + (navigator.standalone === true) +
  ' | switch attr supported=' + ('switch' in probe) +
  ' | vibrate=' + ('vibrate' in navigator);
</script>
</body>
</html>
