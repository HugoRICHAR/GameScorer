<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameScorer">
<meta name="theme-color" content="#140f22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GameScorer</title>
<link rel="stylesheet" href="shared/glass.css">
<style>
  /* Hub field mixes the three games: Scopa amber, Skull King sea, Darts ember. */
  :root {
    --field-base: #140f22;
    --field-1: #f59f00;
    --field-2: #0c8599;
    --field-3: #e8590c;
    --tint: #fff;
    --on-tint: #140f22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--ui);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 560px; margin: 0 auto; padding: 1.25rem 1.1rem 2rem; }

  header { padding: 1.6rem 0.25rem 1.4rem; animation: rise 0.7s var(--spring) backwards; }
  header .kicker { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  h1 { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin-top: 0.2rem; }

  .games { display: flex; flex-direction: column; gap: 14px; }

  .game {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px 14px 14px;
    border-radius: 28px;
    color: inherit;
    text-decoration: none;
    /* each card carries a glow of its own game color under the glass */
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 60%),
      var(--glass-fill);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-shadow);
    transition: transform 0.45s var(--spring), background-color 0.2s;
    animation: rise 0.7s var(--spring) backwards;
    animation-delay: calc(var(--i) * 70ms + 120ms);
  }
  .game:active { transform: scale(0.96); transition-duration: 0.1s; }
  .game:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .game img {
    width: 64px; height: 64px; flex-shrink: 0;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.2);
  }
  .game-text { flex: 1; min-width: 0; }
  .game-name { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .game-tag { font-size: 0.92rem; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
  .resume {
    display: inline-block; margin-top: 7px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 700;
    background: var(--control-on); color: var(--on-tint);
  }
  .chev { font-size: 1.4rem; color: var(--ink-3); flex-shrink: 0; }

  footer {
    margin: 1.6rem auto 0; width: fit-content; max-width: 100%;
    padding: 10px 16px; border-radius: 999px;
    font-size: 0.85rem; color: var(--ink-2); text-align: center;
    animation: rise 0.7s 0.5s var(--spring) backwards;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="gs-field"></div>

<main>
  <header>
    <div class="kicker">Score keepers</div>
    <h1>GameScorer</h1>
  </header>

  <div class="games" id="games"></div>

  <footer class="glass" id="footer">More scorers as they get made</footer>
</main>

<script>
const GAMES = [
  {
    name: 'Scopa',
    tagline: 'Italian trick-taking. Scopa, coins, primiera — first to 11.',
    href: 'scopa/index.html',
    icon: 'scopa/apple-touch-icon.png',
    accent: '#f59f00',
    save: 'scopa-game'
  },
  {
    name: 'Skull King',
    tagline: 'Pirate bidding across 10 rounds. Mind the mermaids.',
    href: 'skull-king/index.html',
    icon: 'skull-king/apple-touch-icon.png',
    accent: '#1c7ed6',
    save: 'skullking-game'
  },
  {
    name: 'Darts',
    tagline: 'X01 and Cricket. Per-dart input, checkout hints, match stats.',
    href: 'darts/index.html',
    icon: 'darts/apple-touch-icon.png',
    accent: '#f76707',
    save: 'darts-game'
  }
];

// iOS Safari only shows :active press states when a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

// A game left mid-play gets a "Resume" tag.
function inProgress(key) {
  try {
    const s = JSON.parse(localStorage.getItem(key));
    return !!s && ['game-screen', 'game', 'cricket'].includes(s.screen);
  } catch (e) { return false; }
}

document.getElementById('games').innerHTML = GAMES.map((g, i) => `
  <a class="game" href="${g.href}" style="--accent:${g.accent};--i:${i}">
    <img src="${g.icon}" alt="">
    <div class="game-text">
      <div class="game-name">${g.name}</div>
      <div class="game-tag">${g.tagline}</div>
      ${inProgress(g.save) ? '<span class="resume">Resume game</span>' : ''}
    </div>
    <span class="chev" aria-hidden="true">›</span>
  </a>
`).join('');

// Outside the home-screen app on iPhone, tell people how to install it.
if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone) {
  document.getElementById('footer').textContent = 'Share → Add to Home Screen for the full-screen app';
}
</script>

</body>
</html>
